[package]
name = "wmf-core"
categories = [
  "graphics",
  "multimedia::images",
  "no-std",
  "parser-implementations",
]
description = "Parser for WMF (Windows Metafile) binaries and converter to SVG, conforming to the MS-WMF specification"
edition = { workspace = true }
keywords = ["metafile", "no-std", "parser", "svg", "wmf"]
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

# docs.rs builds with default features unless told otherwise; enabling
# everything keeps the `svg` converter API visible in the docs.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["svg", "tracing"]
svg = ["dep:base64"]
tracing = ["dep:tracing"]

[dependencies]
base64 = { workspace = true, optional = true }
codepage = { workspace = true }
embedded-io = { workspace = true }
encoding_rs = { workspace = true }
snafu = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true, optional = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true
