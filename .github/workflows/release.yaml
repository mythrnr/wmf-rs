name: "Release"

# Normally invoked via workflow_call from tag-release.yaml after it tags
# the merge commit of a version-bump PR. The tag-push trigger stays as a
# fallback for tags pushed by hand, and workflow_dispatch allows
# re-running a release whose tag already exists.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: "string"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: "string"

# Keyed by version, not ref: when called from tag-release.yaml this must
# not share a group with the caller run, and same-version releases still
# serialize.
concurrency:
  group: "release-${{ inputs.version || github.ref_name }}"
  cancel-in-progress: false

permissions:
  contents: "read"

env:
  # Tag-push runs take the version from the tag; workflow_call and
  # workflow_dispatch runs take it from the input.
  RELEASE_VERSION: "${{ inputs.version || github.ref_name }}"

jobs:
  # Nothing may ship under a version that disagrees with the crate
  # version, so fail closed before any artifact is built. This also
  # catches tags pushed by hand that skipped the version-bump PR.
  check-version:
    name: "Check release version matches workspace version"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Verify the release version equals the workspace version"
        run: |
          versions="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '[.packages[].version] | unique | .[]')"
          if [ "${versions}" != "${RELEASE_VERSION}" ]; then
            echo "release version ${RELEASE_VERSION} does not match workspace version(s): ${versions}" >&2
            exit 1
          fi

  publish-wasm:
    name: "Build and publish wasm artifacts"
    needs: "check-version"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    permissions:
      contents: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - uses: "cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c" # v1.22.0

      - name: "Install wasm tooling"
        run: "cargo binstall -y --locked wasm-bindgen-cli wasm-opt wasm-pack"

      - name: "Build wasm (full)"
        run: "make wasm"

      - name: "Package wasm artifacts (full)"
        run: |
          tar -czf "wmf-wasm-${RELEASE_VERSION}.tar.gz" \
            -C wasm/dist \
            wmf_wasm_bg.wasm \
            wmf_wasm_bg.wasm.d.ts \
            wmf_wasm.js \
            wmf_wasm.d.ts \
            package.json

      # Minimal build drops the `tracing` feature so the bundle ships
      # without the `tracing-wasm` dependency. Output goes to a separate
      # directory so it does not collide with the full build above.
      - name: "Build wasm (minimal, no tracing)"
        run: "make wasm-minimal"

      - name: "Package wasm artifacts (minimal)"
        run: |
          tar -czf "wmf-wasm-minimal-${RELEASE_VERSION}.tar.gz" \
            -C wasm/dist-minimal \
            wmf_wasm_bg.wasm \
            wmf_wasm_bg.wasm.d.ts \
            wmf_wasm.js \
            wmf_wasm.d.ts \
            package.json

      - name: "Publish to GitHub Releases"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if ! gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release create "${RELEASE_VERSION}" \
              --title "${RELEASE_VERSION}" \
              --generate-notes
          fi
          gh release upload "${RELEASE_VERSION}" \
            "wmf-wasm-${RELEASE_VERSION}.tar.gz" \
            "wmf-wasm-minimal-${RELEASE_VERSION}.tar.gz" \
            --clobber

  # Publishes wmf-core to crates.io through Trusted Publishing (OIDC),
  # so no long-lived token is stored in the repository.
  #
  # Runs after publish-wasm because publishing to crates.io cannot be
  # undone (only yanked) while the GitHub Release side is repeatable: a
  # failure anywhere then leaves the tag with nothing half-released, and
  # re-dispatching the workflow is the whole recovery.
  publish-crate:
    name: "Publish wmf-core to crates.io"
    needs: "publish-wasm"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      id-token: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      # Publishing is not idempotent, so a re-run of a release whose
      # crate version already exists (e.g. to rebuild the WASM bundles)
      # must skip this job instead of failing it. crates.io rejects
      # requests without a descriptive User-Agent (data access policy),
      # so one is sent explicitly, and only 404 counts as "not
      # published": any other status (and, via `-e`, any curl failure)
      # fails the job instead of risking a duplicate publish attempt.
      - name: "Check whether the version is already published"
        id: "existing"
        run: |
          status="$(curl -sS -o /dev/null -w "%{http_code}" \
            -A "wmf-rs release workflow (https://github.com/mythrnr/wmf-rs)" \
            "https://crates.io/api/v1/crates/wmf-core/${RELEASE_VERSION}")"
          case "${status}" in
            200)
              echo "wmf-core ${RELEASE_VERSION} is already on crates.io"
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "unexpected status ${status} from crates.io" >&2
              exit 1
              ;;
          esac

      - uses: "rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18" # v1.0.5
        if: "steps.existing.outputs.published == 'false'"
        id: "auth"

      - name: "Publish to crates.io"
        if: "steps.existing.outputs.published == 'false'"
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
        run: "cargo publish -p wmf-core"
